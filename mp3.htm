<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Audio</title>


    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>
     html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


   

        #menu {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            background: rgba(0, 0, 0, 0.85);

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            z-index: 1000;
        }



        #menu button {

            padding: 10px 15px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

            background: #ddd;

            color: #111;
        }



        #menu button.active {

            background: #f5c542;

            color: #000;

            font-weight: bold;
        }



        #panelAudio {

            position: fixed;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: min(700px, 90%);

            max-height: 75vh;

            overflow-y: auto;

            box-sizing: border-box;

            padding: 25px;

            background: rgba(20, 20, 20, 0.95);

            border-radius: 15px;

            z-index: 2000;

            display: none;
        }



        #cerrar {

            display: block;

            margin-left: auto;

            margin-bottom: 20px;

            padding: 10px 16px;

            border: none;

            border-radius: 6px;

            background: #d33;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }


     
        #tituloAudio {

            margin-top: 0;

            color: white;

            text-align: center;

            font-size: 25px;
        }



        #reproductor {

            width: 100%;

            margin-top: 15px;
        }



        #textoAudio {

            margin-top: 20px;

            padding: 20px;

            background: #f5f5f5;

            color: #111;

            border-radius: 10px;

            line-height: 1.5;

            font-size: 16px;
        }



        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
		
		#tituloIndex { 
			position: fixed; 
			top: 5px; left: 50%; 
			transform: translateX(-50%); 
			color: white; 
			background: rgba(0, 0, 0, 0.70); 
			padding: 6px 18px; 
			border-radius: 6px; 
			font-size: 18px; 
			font-weight: bold; 
			z-index: 3000; 
		}


    </style>

</head>


<body>


    <div id="menu">

        <button onclick="location.href='index.html'">
            ÍNDICE
        </button>

        <button class="active">
            AUDIO
        </button>

        <button onclick="location.href='video.htm'">
            VIDEO
        </button>

        <button onclick="location.href='pdf.htm'">
            PDF
        </button>

        <button onclick="location.href='galeria.htm'">
            GALERÍA
        </button>

    </div>


    <div id="tituloIndex">
        audio
    </div>


    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false">


        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

            cursor="fuse: false; rayOrigin: mouse"

            raycaster="objects: .clickable">

        </a-camera>


        <!-- TARGETS DE NAVEGACIÓN -->

        <a-entity
            mindar-image-target="targetIndex: 0"
            data-navegacion="index.html">
        </a-entity>


        <a-entity
            mindar-image-target="targetIndex: 1"
            data-navegacion="mp3.htm">
        </a-entity>


        <a-entity
            mindar-image-target="targetIndex: 2"
            data-navegacion="video.htm">
        </a-entity>


        <a-entity
            mindar-image-target="targetIndex: 3"
            data-navegacion="pdf.htm">
        </a-entity>


        <a-entity
            mindar-image-target="targetIndex: 4"
            data-navegacion="galeria.htm">
        </a-entity>


        <!-- TARGETS DE CONTENIDO -->

        <a-entity

            mindar-image-target="targetIndex: 5"

            data-audio="mp3/audio1.mp3"

            data-titulo="Audio 1"

            data-texto="Texto informativo correspondiente al Audio 1.">

        </a-entity>


        <a-entity

            mindar-image-target="targetIndex: 6"

            data-audio="mp3/audio2.mp3"

            data-titulo="Audio 2"

            data-texto="Texto informativo correspondiente al Audio 2.">

        </a-entity>


    </a-scene>


    <div id="panelAudio">


        <button id="cerrar">
            ← CERRAR
        </button>


        <h1 id="tituloAudio">
            Audio
        </h1>


        <audio id="reproductor" controls>

            Tu navegador no puede reproducir este audio.

        </audio>


        <div id="textoAudio">

            Aquí aparecerá el texto correspondiente
            al contenido reconocido.

        </div>


    </div>


    <script>

        const panelAudio =
            document.getElementById("panelAudio");

        const reproductor =
            document.getElementById("reproductor");

        const tituloAudio =
            document.getElementById("tituloAudio");

        const textoAudio =
            document.getElementById("textoAudio");

        const botonCerrar =
            document.getElementById("cerrar");


        /* TARGETS DE NAVEGACIÓN */

        const targetsNavegacion =
            document.querySelectorAll(
                "[data-navegacion]"
            );


        targetsNavegacion.forEach(function(target) {

            target.addEventListener(
                "targetFound",
                function() {

                    const pagina =
                        target.getAttribute(
                            "data-navegacion"
                        );

                    location.href = pagina;

                }
            );

        });


        /* TARGETS DE AUDIO */

        const targetsAudio =
            document.querySelectorAll(
                "[data-audio]"
            );


        targetsAudio.forEach(function(target) {

            target.addEventListener(
                "targetFound",
                function() {


                    const audio =
                        target.getAttribute(
                            "data-audio"
                        );


                    const titulo =
                        target.getAttribute(
                            "data-titulo"
                        );


                    const texto =
                        target.getAttribute(
                            "data-texto"
                        );


                    tituloAudio.textContent =
                        titulo;


                    textoAudio.textContent =
                        texto;


                    reproductor.src =
                        audio;


                    panelAudio.style.display =
                        "block";

                }

            );

        });


        botonCerrar.addEventListener(
            "click",
            function() {


                reproductor.pause();


                reproductor.currentTime = 0;


                reproductor.removeAttribute("src");

                reproductor.load();


                panelAudio.style.display =
                    "none";

            }
        );

    </script>





</body>

</html>
